name: Patrick Jane 60-Day Series (Every 3 Days, Unique Clips)

on:
  schedule:
    # Runs every 3 days at 10:00 UTC (3:30 PM IST) through 2027-01-17 (auto-stops after 60 days / 20 episodes)
    - cron: '0 10 */3 * *'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload private canary & schedule to YouTube (requires YOUTUBE_TOKEN_JSON secret)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  patrick-jane-episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Restore optional YouTube OAuth token
        run: |
          mkdir -p config
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            printf '%s' '${{ secrets.YOUTUBE_TOKEN_JSON }}' > config/youtube_token.json
          fi

      - name: Produce next unique Patrick Jane episode
        env:
          TAKEDOWN_EMAIL: ${{ secrets.TAKEDOWN_EMAIL }}
        run: |
          if [ "${{ inputs.upload }}" = "true" ] && [ -f config/youtube_token.json ]; then
            python -u run_pipeline.py --series-file patrick_jane_series.json --upload
          else
            python -u run_pipeline.py --series-file patrick_jane_series.json --dry-run
          fi

      - name: Upload QA proof sheet artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrick-jane-qa-output
          path: |
            output/*patrick_jane*_proof.jpg
            output/*patrick_jane*.meta.json
            patrick_jane_series.json
          if-no-files-found: ignore

      - name: Persist used clip IDs & episode counter back to repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add patrick_jane_series.json
          git diff --staged --quiet || (git commit -m "chore(patrick-jane): persist unique clip history & episode count [skip ci]" && git push origin main)
