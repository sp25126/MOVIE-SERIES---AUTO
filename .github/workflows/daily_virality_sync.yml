name: Daily 360° Virality Engine Sync

on:
  schedule:
    # Runs every day at 03:00 UTC (8:30 AM IST - before morning release run)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-virality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily 360° Virality Engine Pre-Scan Across All Categories
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_pipeline.py --self-test
          python -u virality_engine.py

      - name: Commit updated daily virality intelligence back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add niche_catalog.json state/
          git diff --staged --quiet || (git commit -m "chore(radar): daily 360° virality engine sync [skip ci]" && git push origin main)
