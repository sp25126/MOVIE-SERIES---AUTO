name: Autonomous 4-Day Rotating Shorts Release

on:
  schedule:
    # Tier 1: High-reliability 3-hour staggered checkpoints (8 daily off-peak runs)
    # Minute :23 avoids GitHub Actions top-of-hour scheduling congestion
    - cron: '23 */3 * * *'
    # Tier 2: Dedicated Prime-Time Safety Sweep (12:43 UTC = 6:13 PM IST)
    # Guarantees today's 7:30 PM slot is covered even if all earlier runs were delayed
    - cron: '43 12 * * *'
  # Fallback Tier 3: External Webhooks & API pings (e.g. cron-job.org, Uptimerobot, curl)
  repository_dispatch:
    types: [trigger_shorts_pipeline, external_ping, webhook_release]
  # Fallback Tier 4: Git-based manual trigger
  push:
    paths:
      - 'state/trigger.txt'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Day override (0=auto-advance 4-day wheel, 1=Cinema, 2=TV Series, 3=The Mentalist, 4=Song Edits)'
        required: false
        default: '0'
      upload:
        description: 'Upload private canary & schedule to YouTube (requires YOUTUBE_TOKEN_JSON secret)'
        type: boolean
        default: false
      force_weekly_digest:
        description: 'Force weekly virality synthesis scan'
        type: boolean
        default: false

# Prevent concurrent runs from colliding on state files
concurrency:
  group: autonomous-shorts-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository with Full Commit Token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python 3.11 with Pip Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, Audio Codecs & Fonts) with Retry
        run: |
          for i in {1..3}; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf && break || sleep 15
          done

      - name: Install Python Package Dependencies with Retry
        run: |
          for i in {1..3}; do
            pip install --no-cache-dir -r requirements.txt && break || sleep 10
          done

      - name: Restore YouTube OAuth Credentials
        run: |
          mkdir -p config
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            printf '%s' '${{ secrets.YOUTUBE_TOKEN_JSON }}' > config/youtube_token.json
          fi

      - name: Run Master 4-Day Rotating Cadence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TAKEDOWN_EMAIL: ${{ secrets.TAKEDOWN_EMAIL }}
        run: |
          ARGS="--day ${{ inputs.day_override || '0' }}"
          if [ "${{ inputs.force_weekly_digest }}" = "true" ]; then
            ARGS="$ARGS --weekly-digest"
          fi
          if [ -f config/youtube_token.json ] && [ "${{ github.event_name }}" = "schedule" -o "${{ inputs.upload }}" = "true" ]; then
            ARGS="$ARGS --upload"
          else
            ARGS="$ARGS --dry-run"
          fi
          python -u master_orchestrator.py $ARGS

      - name: Archive QA Proof Sheets & Output Metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-cadence-qa-output
          path: |
            output/*_proof.jpg
            output/*.meta.json
            state/*.json
            patrick_jane_series.json
            niche_catalog.json
          if-no-files-found: ignore

      - name: Safe Git State Persistence with Pull-Rebase
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ patrick_jane_series.json niche_catalog.json || true
          if git diff --staged --quiet; then
            echo "No state modifications to commit."
          else
            git commit -m "chore(cadence): advance 4-day wheel, update calendar slots & state [skip ci]"
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 10
            done
          fi
